<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="#10B981" opacity="0.95"/>
  
  <!-- Medicine bottle outline -->
  <g>
    <!-- Bottle body -->
    <rect x="180" y="120" width="152" height="220" rx="12" fill="none" stroke="white" stroke-width="16"/>
    
    <!-- Bottle cap -->
    <rect x="210" y="80" width="92" height="45" rx="6" fill="white"/>
    <rect x="215" y="65" width="82" height="20" rx="4" fill="#10B981"/>
    
    <!-- Checkmark inside bottle (verification) -->
    <g transform="translate(256, 220)">
      <!-- Large checkmark -->
      <polyline points="-40,0 -15,30 50,-40" fill="none" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  
  <!-- Small shield accent (trust symbol) -->
  <g transform="translate(380, 370)">
    <path d="M0,-25 L15,-15 L15,0 Q0,15 -15,0 L-15,-15 Z" fill="#059669" stroke="white" stroke-width="2"/>
  </g>
</svg>
